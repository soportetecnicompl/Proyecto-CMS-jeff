server {
    listen 80;
    server_name ppjm.mplasesores.com;

    # Redirige todo HTTP a HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name ppjm.mplasesores.com;

    # ── Certificados SSL (Certbot los pone aquí) ──
    ssl_certificate     /etc/letsencrypt/live/ppjm.mplasesores.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ppjm.mplasesores.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── Seguridad ──
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";

    # ── Proxy al contenedor Docker ──
    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";

        proxy_cache_bypass $http_upgrade;

        # Timeouts generosos para operaciones largas
        proxy_read_timeout 300;
        proxy_connect_timeout 300;
        proxy_send_timeout 300;

        # Tamaño máximo de subida (logos, etc.)
        client_max_body_size 20M;
    }
}
