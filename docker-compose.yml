version: '3.8'

services:
  proyecto-cms:
    image: proyecto-cms:latest
    build: .
    container_name: proyecto-cms
    restart: unless-stopped
    ports:
      - "3000:3000"        # Cambia 3000 por el puerto que uses en tu VPS
    volumes:
      - cms-data:/app/data # Persistencia de la base de datos SQLite
    environment:
      - NODE_ENV=production
      - PORT=3000
      # ↓ CAMBIA ESTAS VARIABLES ↓
      - JWT_SECRET=CAMBIA_ESTO_POR_UNA_CLAVE_LARGA_Y_ALEATORIA_12345
      - JWT_EXPIRES_IN=7d
      - APP_URL=https://tudominio.com
      # Configuración SMTP (correo para invitaciones)
      - SMTP_HOST=smtp.gmail.com
      - SMTP_PORT=587
      - SMTP_SECURE=false
      - SMTP_USER=tu_correo@gmail.com
      - SMTP_PASS=tu_contraseña_de_aplicacion
      - SMTP_FROM=ProyectoCMS <tu_correo@gmail.com>
      # Credenciales del administrador inicial
      - ADMIN_NAME=Administrador
      - ADMIN_EMAIL=admin@tuempresa.com
      - ADMIN_PASSWORD=Admin123!

volumes:
  cms-data:
    driver: local
